name: Build APK
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk CleanTube.apk
      - uses: actions/upload-artifact@v4
        with: { name: CleanTube-apk, path: CleanTube.apk }
      - uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: CleanTube (son derleme)
          artifacts: CleanTube.apk
          allowUpdates: true
          removeArtifacts: true
          prerelease: true
          body: "Otomatik derleme. APK'yi indirip kurmak icin CleanTube.apk dosyasina dokun."
