name: Build VYRO APKs
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --stacktrace
      - name: Prepare APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VYRO-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/VYRO-release.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VYRO-APKs
          path: dist/*
          if-no-files-found: error
      - name: Publish installable test release
        uses: ncipollo/release-action@v1
        with:
          tag: vyro-latest
          name: VYRO latest test build
          artifacts: dist/VYRO-debug.apk,dist/VYRO-release.apk,dist/SHA256SUMS.txt
          allowUpdates: true
          removeArtifacts: true
          prerelease: true
          body: |
            VYRO debug and release APKs for device testing.
            The release APK is CI-signed with the debug key for installation testing.
            It is not signed with a production Play Store upload key.
