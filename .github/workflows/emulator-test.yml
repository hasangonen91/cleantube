name: Emulator smoke test
on:
  workflow_dispatch:
  push:
    branches: ["fix/**"]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_3a
          disable-animations: true
          script: bash scripts/emulator_smoke.sh ${{ matrix.api-level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-api-${{ matrix.api-level }}
          path: out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vyro-apk-api-${{ matrix.api-level }}
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: APK'yi apk-builds dalina yayinla
        if: matrix.api-level == 30
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/VYRO-debug.apk
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git checkout --orphan apk-builds
          git rm -rf . -q
          cp /tmp/VYRO-debug.apk VYRO-debug.apk
          echo "$GITHUB_SHA" > SOURCE_SHA.txt
          git add VYRO-debug.apk SOURCE_SHA.txt
          git commit -q -m "VYRO debug APK ($GITHUB_SHA)"
          git push -f origin apk-builds
